name: Image
on: [push, pull_request, workflow_dispatch]

jobs:
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: fleet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d fleet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/fleet
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: uv run pytest -m integration -v

  image:
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # upload-sarif écrit dans l'onglet Security
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nom d'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # attestations incompatibles avec load: on ne les produit qu'au push
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
      # Scan bloquant : uniquement ce qui est corrigeable
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
      # Scan informatif : tout est remonté dans l'onglet Security, sans bloquer
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: ${{ !cancelled() }}
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@v3
        # Une PR depuis un fork n'a pas le droit d'écrire dans Security
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        with:
          sarif_file: trivy-results.sarif
      # On teste l'artefact produit, pas seulement le code
      - name: Test de l'image (smoke test avec PostgreSQL)
        run: |
          docker network create smoke
          docker run -d --name db --network smoke \
            -e POSTGRES_USER=app -e POSTGRES_PASSWORD=app -e POSTGRES_DB=fleet \
            --health-cmd "pg_isready -U app -d fleet" --health-interval 2s \
            postgres:18-alpine
          until [ "$(docker inspect -f '{{.State.Health.Status}}' db)" = healthy ]; do sleep 1; done
          docker run -d --name api --network smoke -p 8000:8000 \
            -e DATABASE_URL=postgresql://app:app@db:5432/fleet \
            "$IMAGE:sha-${GITHUB_SHA}"
          for i in $(seq 1 30); do
            curl -fsS localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
