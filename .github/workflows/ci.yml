name: CI

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up project
        uses: ./.github/actions/setup
        with:
          python-version: "3.12"

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up project
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test with coverage
        run: uv run pytest -v --cov=src/fleet_api --cov-report=html:htmlcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: htmlcov
          retention-days: 7

  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up project
        uses: ./.github/actions/setup
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build
